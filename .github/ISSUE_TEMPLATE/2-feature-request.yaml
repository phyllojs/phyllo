name: Feature request | 功能请求
description: Suggest a feature or improvement for Phyllo | 为 Phyllo 提出功能或改进建议
title: '[FEAT] <title>'
labels:
  - enhancement
assignees:
  - xueelf
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Check the [documentation](https://phyllo.js.org/en/guide/introduction) and existing issues first, then describe the problem this feature should solve.

        感谢你的建议。请先查阅[文档](https://phyllo.js.org/zh/guide/introduction)和已有 issue，再说明该功能要解决的问题。

  - type: textarea
    id: problem
    attributes:
      label: Problem | 问题
      description: What are you trying to do, and what blocks you today? | 你想做什么，目前遇到什么阻碍？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution | 建议的方案
      description: Describe the expected behavior, with a config or code example if possible. | 描述期望的行为，最好附上配置或代码示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered | 考虑过的替代方案
      description: Workarounds you tried, or other designs you weighed. | 你尝试过的临时方案，或考虑过的其他设计。

  - type: textarea
    id: references
    attributes:
      label: References | 参考资料
      description: Prior art in other frameworks or tools. | 其他框架或工具中的同类实现。
