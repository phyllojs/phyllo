<title id="title">Phyllo: tangent circles</title>
<desc id="desc">Corners 1 to 5 use radius 1.5. Turn 6 uses radius 10. Each panel has its own magnification. Orange dots mark tangent contacts. Gray lines are tangents, and dashed orange lines are radii.</desc>
