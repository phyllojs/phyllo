  .round { stroke: #a84910; }
  .contact { fill: #a84910; }
  .label { fill: #354154; font-family: ui-sans-serif, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .background { fill: #191b21; }
    .guide { stroke: #8993a3; }
    .outline { stroke: #85aeff; }
    .sheet { fill: #85aeff; fill-opacity: .2; }
    .round { stroke: #f4aa72; }
    .contact { fill: #f4aa72; }
    .label { fill: #e5e9f1; }
  }
</style>
